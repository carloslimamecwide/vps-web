name: vps-web-staging

services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/carloslimamecwide/vps-web}:${TAG:?Define TAG com o SHA completo publicado no GHCR}
    init: true
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3100:3000"
