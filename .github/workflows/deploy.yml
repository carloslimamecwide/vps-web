name: Build & Publish - VPS Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/carloslimamecwide/vps-web

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ops
      - name: Validar workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 .github/workflows/deploy.yml examples/build-and-deploy.yml
      - name: Validar scripts shell
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" --entrypoint shellcheck rhysd/actionlint:1.7.12 /repo/examples/postgres/backup.sh /repo/examples/postgres/restore-check.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar Node.js para os testes
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Construir a imagem para validação
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar a imagem num ambiente isolado
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.staging.yml up --wait --wait-timeout 120
          node scripts/smoke-http.mjs http://127.0.0.1:3100

      - name: Verificar vulnerabilidades da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Remover o ambiente de teste
        if: always()
        env:
          TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.staging.yml down

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem validada
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          # Aliases existentes para compatibilidade; os deployments usam o SHA.
          for alias in latest deploy; do
            docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:$alias"
            docker push "$IMAGE_NAME:$alias"
          done
