services:
  web:
    image: ghcr.io/carloslimamecwide/vps-web:${TAG:-latest}
    container_name: vps-web
    restart: unless-stopped
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  apps:
    external: true
