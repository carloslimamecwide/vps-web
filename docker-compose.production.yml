services:
  web:
    image: ghcr.io/carloslimamecwide/vps-web:${TAG:-latest}
    container_name: vps-web
    restart: unless-stopped
    networks:
      - apps
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  apps:
    external: true
