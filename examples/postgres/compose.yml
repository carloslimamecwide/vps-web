services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exemplo1
      POSTGRES_USER: exemplo1
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "exemplo1", "-d", "exemplo1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  postgres_password:
    file: /srv/secrets/postgres_password

networks:
  data:
    external: true
