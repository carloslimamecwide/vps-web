name: Build e deployment do laboratório

on:
  push:
    branches: [main]

concurrency:
  group: laboratorio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/UTILIZADOR_GITHUB/nome-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Testar o arranque da imagem
        run: |
          docker run -d --name lab-smoke --memory 512m --cpus 1 "$IMAGE_NAME:$GITHUB_SHA"
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lab-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          exit 1
      - name: Verificar vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Remover contentor de teste
        if: always()
        run: docker rm -f lab-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar a imagem validada
        run: docker push "$IMAGE_NAME:$GITHUB_SHA"

  deploy:
    needs: build
    runs-on: self-hosted
    environment: laboratorio
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar a versão anterior e atualizar
        env:
          TAG: ${{ github.sha }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -euo pipefail
          target=/srv/apps/nome-app
          mkdir -p "$target"
          if [ -f "$target/docker-compose.yml" ]; then
            cp "$target/docker-compose.yml" "$target/docker-compose.previous.yml"
            container=$(docker ps -aq --filter 'name=^/nome-app$')
            if [ -n "$container" ]; then
              docker inspect --format '{{.Config.Image}}' "$container" > "$target/previous-image.txt"
            fi
          fi
          cp docker-compose.production.yml "$target/docker-compose.yml"
          cd "$target"
          docker compose config --quiet
          docker compose pull
          docker compose up --wait --wait-timeout 120 --remove-orphans
          if [ -n "$SMOKE_URL" ]; then
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --retry-delay 2 --connect-timeout 5 --max-time 15 "$SMOKE_URL" > /dev/null
          else
            printf 'Primeiro deploy: verificar o URL após configurar o proxy na fase 10\n'
          fi
      - name: Terminar sessão do registry
        if: always()
        run: docker logout ghcr.io
