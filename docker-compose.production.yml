services:
  web:
    image: ghcr.io/carloslimamecwide/vps-web:${TAG:?Define TAG com o SHA completo publicado no GHCR}
    container_name: vps-web
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - HOSTNAME=0.0.0.0
    networks:
      - apps
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  apps:
    external: true
